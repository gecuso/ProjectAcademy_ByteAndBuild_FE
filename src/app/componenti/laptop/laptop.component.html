<div class="container py-4">
  <div class="row">
    
    <!-- Colonna sinistra: Radio Button Marche -->
    <div class="col-md-3">
      <h5>Filtra per marca</h5>
      <mat-radio-group [(ngModel)]="marcaSelezionata">
        <mat-radio-button 
          *ngFor="let marca of marche" 
          [value]="marca"
          class="d-block mb-2">
          {{ marca }}
        </mat-radio-button>
      </mat-radio-group>
      <div class="d-flex align-items-center gap-2 mb-3">
  <mat-form-field appearance="fill" class="w-50">
    <mat-label>Min</mat-label>
    <input matInput type="number">
  </mat-form-field>

  <mat-form-field appearance="fill" class="w-50">
    <mat-label>Max</mat-label>
    <input matInput type="number">
  </mat-form-field>
</div>
      <mat-slider min="200" max="500">
        <input value="300" matSliderStartThumb>
        <input value="400" matSliderEndThumb>
      </mat-slider>

    </div>

    <!-- Colonna destra: Prodotti -->
    <div class="col-md-9">
      <h1>Laptop</h1>
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
        <div class="col" *ngFor="let prodotto of prodottiFiltrati()">
          <mat-card appearance="outlined">
            <mat-card-header>
              <mat-card-title>{{ prodotto.titolo }}</mat-card-title>
            </mat-card-header>
            <img mat-card-image [src]="prodotto.immagine" [alt]="prodotto.titolo">
            <mat-card-content>
              <p>{{ prodotto.descrizione }}</p>
            </mat-card-content>
            <mat-card-actions>
              <button mat-button>Dettagli</button>
            </mat-card-actions>
          </mat-card>
        </div>
      </div>
    </div>

  </div>
</div>
