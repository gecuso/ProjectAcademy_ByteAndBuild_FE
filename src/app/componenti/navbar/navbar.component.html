<nav class="navbar navbar-dark shadow-sm px-3 py-2 custom-navbar">
  <div class="container d-flex flex-column align-items-start">
    <!-- ROW: Logo + Search + Icone -->
    <div
      class="d-flex align-items-center justify-content-between w-100 flex-wrap mb-2"
    >
      <!-- Logo -->
      <a class="navbar-brand me-3" routerLink="/home">
        <img src="logo.png" alt="Home" class="logo-img" />
      </a>

      <!-- Search bar (al centro, cresce) -->
      <form class="flex-grow-1 mx-3 position-relative" style="max-width: 900px" #param="ngForm" 
      (ngSubmit)="ricerca()" 
        >
        <input
          class="form-control rounded-pill"
          type="search"
          placeholder="Cosa cerchi?"
          [(ngModel)]="elementoCercato"
          name="search"
          style="padding-left: 40px"
        />
        <i class="bi bi-search position-absolute search-icon"></i>
      </form>

      <div class="d-flex align-items-center gap-3">
        <a routerLink="/dettagliUtente" title="Utente">
          <i class="bi bi-person fs-4 icon-white"></i>
        </a>
        <a routerLink="/carrello" title="Carrello">
          <i class="bi bi-cart fs-4 icon-white"></i>
        </a>
        <button
          class="btn btn-outline-light btn-sm"
          (click)="logout()"
          *ngIf="isLoggedIn"
          title="Logout"
        >
          Logout
        </button>
      </div>
    </div>

    <div class="d-flex align-items-center gap-3 w-100 flex-wrap">
      <!-- Bottone categorie -->
      <button mat-button [matMenuTriggerFor]="menu">
        <mat-icon>menu</mat-icon> Categorie
      </button>

      <!-- MatMenu -->
      <mat-menu #menu="matMenu" class="scrollable-menu">
        <button
          mat-menu-item
          *ngFor="let voce of categorie"
          [routerLink]="
            voce.id === null ? '/listaProdotti' : '/listaProdotti/' + voce.id
          "
        >
          {{ capitalize(voce.descrizione) }}
        </button>
      </mat-menu>

      <!-- Link pagine -->
      <ul class="navbar-nav d-flex flex-row flex-wrap gap-3 mb-0">
        <li class="nav-item">
          <a class="nav-link px-2" routerLink="/listaProdotti/13">Pc</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-2" routerLink="/listaProdotti/7">Mouse</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-2" routerLink="/listaProdotti/12">Tastiere</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-2" routerLink="/listaProdotti/4">Laptop</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-2" routerLink="/listaProdotti/6">Monitor</a>
        </li>
        <li class="nav-item"><span class="nav-link px-2">|</span></li>
        <li class="nav-item">
          <a class="nav-link px-2" routerLink="/chisiamo">Chi siamo</a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link px-2"
            href="https://www.nvidia.com/it-it/"
            target="_blank"
            rel="noopener noreferrer"
            >Nvidia</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link px-2"
            href="https://www.intel.com/content/www/us/en/homepage.html"
            target="_blank"
            rel="noopener noreferrer"
            >Intel</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link px-2"
            href="https://it.msi.com/"
            target="_blank"
            rel="noopener noreferrer"
            >Msi</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link px-2" routerLink="/lavoraconnoi">Lavora con noi</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!--npm install bootstrap-icons per icone bootstrap-->
