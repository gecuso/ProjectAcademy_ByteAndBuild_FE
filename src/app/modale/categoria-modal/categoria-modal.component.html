<div class="modal">
  <h3>Dettagli {{ categoria }}</h3>
  <form categoriaForm>
    <div *ngFor="let f of categoryFields[categoria]">
      <label>{{ f.label }}</label>
      <input [type]="f.type" [formControlName]="f.key" />
    </div>
    <button type="button" (click)="salva()">Salva</button>
    <button type="button" (click)="chiudiModal()">Annulla</button>
  </form>
</div>
